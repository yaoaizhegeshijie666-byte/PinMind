services:
  - type: web
    name: pinmind-api
    runtime: docker
    plan: free
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /health
    envVars:
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: "openai/gpt-4.1-mini"
      - key: DATABASE_URL
        sync: false
      - key: PINMIND_DEVICE_TOKEN
        sync: false
      - key: PINMIND_CRON_SECRET
        generateValue: true
      - key: PINMIND_CORS_ORIGIN
        value: "*"
