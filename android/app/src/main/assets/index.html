<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#f4f2ed" />
  <title>PinMind · 今日知识</title>
  <link rel="stylesheet" href="styles.css" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body>
  <div class="app-splash" id="appSplash" role="status" aria-label="PinMind 正在加载">
    <svg class="splash-logo" aria-hidden="true" viewBox="0 0 32 32"><path d="M9 23.5V8.5A4.5 4.5 0 0 1 13.5 4h5a6 6 0 0 1 0 12H9"/><circle cx="18.5" cy="10" r="2.3"/><path class="logo-link" d="M13 24l3 4 3-4"/></svg>
    <strong>PinMind</strong><span>正在整理你的知识</span><i></i>
  </div>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar" aria-label="主导航">
      <div class="brand"><svg class="brand-logo" aria-hidden="true" viewBox="0 0 32 32"><path d="M9 23.5V8.5A4.5 4.5 0 0 1 13.5 4h5a6 6 0 0 1 0 12H9"/><circle cx="18.5" cy="10" r="2.3"/><path class="logo-link" d="M13 24l3 4 3-4"/></svg><span>PinMind</span></div>
      <label class="search">
        <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg>
        <input type="search" placeholder="搜索知识、主题或来源" />
      </label>
      <nav>
        <button class="nav-item active" data-page="today"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>今日知识</button>
        <button class="nav-item" data-page="library"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="7" cy="7" r="2.5"/><circle cx="17" cy="7" r="2.5"/><circle cx="12" cy="17" r="2.5"/><path d="M9.2 8.3l1.9 6.3m3.7-6.3-1.9 6.3M9.5 7h5"/></svg></span>知识库</button>
        <button class="nav-item muted" data-page="uncollected"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M5 8h14v11H5zM8 5h8l2 3H6z"/><path d="M9 12h6"/></svg></span>未收录</button>
        <button class="nav-item muted" data-page="sources"><span class="nav-icon"><svg viewBox="0 0 24 24"><path d="M8 5H5v14h11v-3"/><path d="M11 4h8v8M19 4l-9 9"/></svg></span>来源记录</button>
      </nav>
      <section class="history" aria-label="历史知识">
        <div class="history-heading"><span>历史知识</span><small>未阅</small></div>
      </section>
      <button class="nav-item settings" data-page="settings"><span class="nav-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 3v3m0 12v3M3 12h3m12 0h3M5.6 5.6l2.1 2.1m8.6 8.6 2.1 2.1m0-12.8-2.1 2.1m-8.6 8.6-2.1 2.1"/></svg></span>设置</button>
    </aside>

    <main>
      <div class="mobile-bar">
        <button class="icon-button" id="menuButton" aria-label="打开菜单">☰</button>
        <div class="brand compact"><svg class="brand-logo" aria-hidden="true" viewBox="0 0 32 32"><path d="M9 23.5V8.5A4.5 4.5 0 0 1 13.5 4h5a6 6 0 0 1 0 12H9"/><circle cx="18.5" cy="10" r="2.3"/><path class="logo-link" d="M13 24l3 4 3-4"/></svg><span>PinMind</span></div>
        <button class="icon-button search-trigger" id="mobileSearchButton" aria-label="搜索"><svg viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"></circle><path d="m16 16 4.5 4.5"></path></svg></button>
      </div>
      <section class="mobile-search" id="mobileSearch" aria-hidden="true">
        <div class="mobile-search-head"><label class="search"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"></circle><path d="m20 20-3.5-3.5"></path></svg><input type="search" placeholder="搜索知识、主题或来源" /></label><button id="closeMobileSearch" aria-label="关闭搜索">×</button></div>
        <div class="mobile-search-empty">
          <div class="search-empty-icon"><span></span><i></i></div>
          <p>搜索你的知识、主题或来源</p>
        </div>
      </section>
      <div class="content" id="todayPage">
        <header class="page-header">
          <div><p class="eyebrow">DAILY EDITION</p><h1>今日知识</h1><p class="date">等待生成</p></div>
          <button class="read-button" id="readButton">已阅</button>
        </header>

        <section class="intro"><span></span><p>正在读取今天新增的链接、文字和截图。</p><div class="capture-actions"><button class="capture-button" id="pasteLinkButton">粘贴链接</button><button class="capture-button upload-screenshot-button" id="uploadScreenshotButton">上传截图</button><input id="screenshotInput" type="file" accept="image/jpeg,image/png,image/webp" hidden /></div></section>
        <section class="knowledge-list" id="knowledgeList"></section>

        <section class="empty-state" id="emptyState" hidden>
          <div class="empty-graphic"><span></span><span></span><span></span></div>
          <h2>今日知识已阅</h2>
          <p>新的知识正在慢慢形成，明天见。</p>
          <button id="viewLibraryButton" data-page="library">查看知识库</button>
        </section>
      </div>
      <div class="page-host" id="pageHost" hidden></div>
    </main>
  </div>
  <div class="scrim" id="scrim"></div>
  <aside class="drawer" id="drawer" aria-hidden="true"><header><div><p>知识详情</p><h2></h2></div><button id="closeDrawer" aria-label="关闭">×</button></header><div class="drawer-body"></div></aside>
  <script src="knowledge-state.js"></script>
  <script src="api-client.js"></script>
  <script src="app.js"></script>
  <script src="pages.js"></script>
</body>
</html>
