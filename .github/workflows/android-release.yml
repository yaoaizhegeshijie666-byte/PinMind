name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Restore stable signing key
        env:
          PINMIND_KEYSTORE_BASE64: ${{ secrets.PINMIND_KEYSTORE_BASE64 }}
        run: echo "$PINMIND_KEYSTORE_BASE64" | base64 --decode > pinmind-mvp.jks
      - name: Build signed release APK
        env:
          PINMIND_KEYSTORE_PATH: pinmind-mvp.jks
          PINMIND_KEYSTORE_PASSWORD: ${{ secrets.PINMIND_KEYSTORE_PASSWORD }}
          PINMIND_KEY_ALIAS: ${{ secrets.PINMIND_KEY_ALIAS }}
          PINMIND_KEY_PASSWORD: ${{ secrets.PINMIND_KEY_PASSWORD }}
        run: gradle :app:assembleRelease --stacktrace
      - name: Verify APK signature
        run: jarsigner -verify -verbose -certs app/build/outputs/apk/release/app-release.apk
      - name: Prepare APK
        run: cp app/build/outputs/apk/release/app-release.apk ../PinMind-MVP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PinMind-MVP
          path: PinMind-MVP.apk
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" PinMind-MVP.apk --title "PinMind MVP ${GITHUB_REF_NAME}" --generate-notes