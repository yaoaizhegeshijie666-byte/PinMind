name: Build Android APK

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Build installable debug APK
        run: gradle :app:assembleDebug --stacktrace
      - name: Prepare APK
        run: cp app/build/outputs/apk/debug/app-debug.apk ../PinMind-MVP.apk
      - uses: actions/upload-artifact@v4
        with:
          name: PinMind-MVP
          path: PinMind-MVP.apk
      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/')
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" PinMind-MVP.apk --title "PinMind MVP ${GITHUB_REF_NAME}" --generate-notes
